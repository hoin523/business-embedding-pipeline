[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-business-embedding"
version = "0.1.0"
description = "Korean merchant, supplier, and industry-name embedding data pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
